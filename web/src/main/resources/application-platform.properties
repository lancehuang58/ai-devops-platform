server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/aidevops
spring.datasource.username=aidevops
spring.datasource.password=aidevops
platform.auth.alert-token=dev-alert-token
platform.workflow.workers=8
platform.jira.base-url=http://127.0.0.1:9
platform.llm.mode=fake
platform.execution.mode=fake
platform.monitoring.enabled=false
platform.catalog.file=config/platform-services.yml
platform.gitlab.base-url=${GITLAB_BASE_URL}
spring.security.oauth2.client.registration.gitlab.client-id=${GITLAB_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.gitlab.client-secret=${GITLAB_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.gitlab.client-name=GitLab
spring.security.oauth2.client.registration.gitlab.scope=openid,profile,email
spring.security.oauth2.client.registration.gitlab.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gitlab.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.gitlab.issuer-uri=${platform.gitlab.base-url}
