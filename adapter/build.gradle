plugins { id 'java-test-fixtures' }
description = 'Outbound and event adapters; test doubles stay in test fixtures'
dependencies {
    api platform('org.springframework.ai:spring-ai-bom:2.0.2')
    implementation 'org.springframework.ai:spring-ai-openai'
    api 'org.springframework.ai:spring-ai-mcp'

    implementation project(':service')
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.yaml:snakeyaml'
    implementation 'com.h2database:h2'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testFixturesApi project(':service')
}

// Spring AI tool schemas use the declared parameter names.
tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-parameters') }
